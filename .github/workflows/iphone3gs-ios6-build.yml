name: iPhone 3GS iOS 6 / Linux build smoke test

on:
  push:
    branches: [ios6-3gs-termux]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm-softmmu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex gcc g++ git libglib2.0-dev libpixman-1-dev \
            libfdt-dev libslirp-dev libusb-1.0-0-dev ninja-build pkg-config \
            python3 python3-venv python3-pip
      - name: Configure headless ARM system emulator
        run: |
          mkdir -p build
          cd build
          ../configure \
            --target-list=arm-softmmu \
            --enable-tcg \
            --disable-cocoa \
            --disable-gtk \
            --disable-sdl \
            --disable-werror \
            --prefix="$GITHUB_WORKSPACE/build/install"
      - name: Compile
        run: ninja -C build
      - name: Verify the existing iPhone 3G machine remains registered
        run: build/qemu-system-arm -machine help | grep -i iphone3g
      - name: Python syntax and IPSW inspector tests
        run: |
          python3 -m py_compile scripts/ios/inspect-iphone3gs-ios6.py
          python3 -m unittest scripts.ios.tests.test_inspect_iphone3gs_ios6
      - name: Check Termux helper shell syntax
        run: bash -n scripts/ios/build-termux.sh
